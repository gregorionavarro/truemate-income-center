<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrueMate Income Center · Compartido</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#f4f7fb}.wrap{height:100%;display:flex;flex-direction:column}.syncbar{height:42px;flex:0 0 42px;background:#102f51;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;box-sizing:border-box}.left{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:#f0b429;box-shadow:0 0 0 3px rgba(255,255,255,.08)}.ok .dot{background:#2fc179}.bad .dot{background:#ef5d6c}.muted{opacity:.8;font-weight:500}iframe{border:0;width:100%;flex:1;background:#f4f7fb}
</style>
</head>
<body>
<div class="wrap">
  <div class="syncbar" id="syncbar">
    <div class="left"><span class="dot"></span><span id="status">Conectando base compartida…</span></div>
    <span class="muted">TrueMate · Multiusuario</span>
  </div>
  <iframe id="app" title="TrueMate Income Center"></iframe>
</div>
<script>
const KEYS=['tmic_r','tmic_p','tmic_c','tmic_t'];
const defaults={tmic_r:'[]',tmic_p:'["Greg","Carlos","Paulina","Fabiola"]',tmic_c:'["Imperial PFS","Great West","RPS"]',tmic_t:'[]'};
const bar=document.getElementById('syncbar'),statusEl=document.getElementById('status'),frame=document.getElementById('app');
let lastServer='',saving=false,booted=false,lastReload=0;

function setStatus(text,type=''){
  statusEl.textContent=text;
  bar.className='syncbar '+type;
}
function localState(){
  return {
    r:JSON.parse(localStorage.getItem('tmic_r')||defaults.tmic_r),
    p:JSON.parse(localStorage.getItem('tmic_p')||defaults.tmic_p),
    c:JSON.parse(localStorage.getItem('tmic_c')||defaults.tmic_c),
    t:JSON.parse(localStorage.getItem('tmic_t')||defaults.tmic_t)
  };
}
function stateString(s){return JSON.stringify(s)}
function applyState(s){
  localStorage.setItem('tmic_r',JSON.stringify(s.r||[]));
  localStorage.setItem('tmic_p',JSON.stringify(s.p||JSON.parse(defaults.tmic_p)));
  localStorage.setItem('tmic_c',JSON.stringify(s.c||JSON.parse(defaults.tmic_c)));
  localStorage.setItem('tmic_t',JSON.stringify(s.t||[]));
}
function modalOpen(){
  try{return frame.contentDocument?.getElementById('modal')?.classList.contains('on')}catch(_){return false}
}
async function getRemote(){
  const r=await fetch('/api/state',{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo leer D1');
  return r.json();
}
async function saveRemote(s){
  if(saving)return;
  saving=true;
  try{
    setStatus('Guardando cambios…');
    const r=await fetch('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:s})});
    if(!r.ok) throw new Error('No se pudo guardar');
    lastServer=stateString(s);
    setStatus('Sincronizado · todos ven la misma información','ok');
  }catch(e){
    setStatus('Error de sincronización · revisa conexión','bad');
  }finally{saving=false}
}
async function boot(){
  try{
    const data=await getRemote();
    const remote=data.state;
    applyState(remote);
    lastServer=stateString(remote);
    setStatus('Sincronizado · todos ven la misma información','ok');
  }catch(e){
    KEYS.forEach(k=>{if(localStorage.getItem(k)==null)localStorage.setItem(k,defaults[k])});
    setStatus('Modo local temporal · D1 no respondió','bad');
  }
  frame.src='/index.html?shared=1';
  booted=true;
}

setInterval(async()=>{
  if(!booted)return;
  const local=localState(), localStr=stateString(local);
  if(localStr!==lastServer){
    await saveRemote(local);
    return;
  }
  try{
    const data=await getRemote();
    const remoteStr=stateString(data.state);
    if(remoteStr!==lastServer && !modalOpen()){
      applyState(data.state);
      lastServer=remoteStr;
      const now=Date.now();
      if(now-lastReload>2500){lastReload=now;frame.contentWindow.location.reload()}
      setStatus('Actualizado con cambios del equipo','ok');
    }
  }catch(e){setStatus('Sin conexión con D1','bad')}
},2500);

boot();
</script>
</body>
</html>
